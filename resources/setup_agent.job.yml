resources:
  jobs:
    setup_agent:
      name: genie-cost-estimator-setup
      description: Build or update the Genie Cost Estimator Agent (tables, functions, DCP calculator, rate cards, use cases, agent definition, benchmarks), then grant the agent user groups access. Run on install and after any change.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tasks:
        - task_key: setup_agent
          notebook_task:
            notebook_path: ../setup_genie_dcp_agent.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              pricing_path: ""
              rate_source: ${var.rate_source}
              price_regions: ${var.price_regions}
              requests_path: ${var.requests_path}
              space_id: ${var.space_id}
              space_title: ${var.space_title}
              user_group: ""            # grants are applied by the grant_access task below
              load_pricing_tables: ${var.load_pricing_tables}
              smoke_test: "true"
        - task_key: grant_access
          depends_on:
            - task_key: setup_agent
          notebook_task:
            notebook_path: ../notebooks/12_grant_access.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              user_groups: ${var.user_groups}
              space_id: "{{tasks.setup_agent.values.space_id}}"
              space_title: ${var.space_title}
              warehouse_id: ${var.warehouse_id}
              revoke_others: ${var.revoke_others}
