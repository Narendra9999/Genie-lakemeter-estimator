resources:
  jobs:
    setup_agent:
      name: dcp-estimator-setup
      description: Install the DCP calculator, rates, requests, input schema and Genie configuration.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tasks:
        - task_key: setup_agent
          notebook_task:
            notebook_path: ../setup_genie_dcp_agent.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              rate_source: ${var.rate_source}
              sku_region: ${var.sku_region}
              space_id: ${var.space_id}
              space_title: ${var.space_title}
