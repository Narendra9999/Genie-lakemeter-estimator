resources:
  jobs:
    rate_refresh:
      name: genie-cost-estimator-rate-refresh
      description: Reload dcp_rate_card and ref_dbu_price_card from system.billing (account_prices or list_prices). A SKU without exactly one current price is PENDING.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}
      tasks:
        - task_key: refresh_rates
          notebook_task:
            notebook_path: ../notebooks/09_load_rate_card.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              rate_source: ${var.rate_source}
              sku_region: ${var.sku_region}
              price_regions: ${var.price_regions}
