bundle:
  name: dcp-cost-estimator

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog for DCP calculator objects
  schema:
    description: DCP schema
    default: dcp_estimator
  warehouse_id:
    description: Genie-compatible SQL warehouse ID
  rate_source:
    description: ACCOUNT_PRICES or LIST_PRICES
    default: ACCOUNT_PRICES
  sku_region:
    description: Billing SKU suffix for US_EAST_1
    default: US_EAST_N_VIRGINIA
  space_id:
    description: Existing agent ID to update; blank creates a new agent
    default: ""
  space_title:
    description: DCP agent title
    default: DCP Cost Estimator
  schedule_pause_status:
    description: PAUSED or UNPAUSED for daily DCP rate refresh
    default: PAUSED
  run_as_service_principal:
    description: Service principal application ID for production jobs
    default: ""

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
